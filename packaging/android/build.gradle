buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Keep this aligned with the Qt 6.10 Android template used by CI.
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

// Kotlin 1.8+ folded the old jdk7/jdk8 extension jars into kotlin-stdlib.
// youtubedl-android 0.18.1 still brings the 1.7.22 split artifacts through
// transitive dependencies, while AndroidX resolves kotlin-stdlib 1.8.22.
// Excluding the obsolete split jars prevents duplicate-class packaging errors.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.16.0'

    // Use the published AARs instead of copying only classes.jar. The library
    // AAR brings the Python/QuickJS runtime, raw yt-dlp resource and transitive
    // Java/Kotlin dependencies that YoutubeDL.init()/execute() actually need.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    // YoutubeDL always supplies --ffmpeg-location. Ship its matching binary so
    // audio extraction/post-processing works on a clean Android installation.
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}

android {
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError = false
    }

    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}
